name: revolut_sdk_bridge
description: "Flutter plugin for accepting Revolut Pay payments via the native Revolut Pay SDKs on Android and iOS."
version: 0.2.1
homepage: https://github.com/itsMohammedAli/Revolut-Flutter-SDK
repository: https://github.com/itsMohammedAli/Revolut-Flutter-SDK
issue_tracker: https://github.com/itsMohammedAli/Revolut-Flutter-SDK/issues

environment:
  sdk: ^3.9.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: 29.1.0
  freezed: 4.0.3
  build_runner: 2.17.1
  json_serializable: 6.15.2

flutter:
  plugin:
    platforms:
      android:
        package: com.revolutpay.flutter
        pluginClass: RevolutSdkBridgePlugin
      ios:
        pluginClass: RevolutSdkBridgePlugin
