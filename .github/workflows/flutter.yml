name: Flutter checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify Pigeon bindings
        run: |
          bash tool/generate_pigeon.sh
          git diff --exit-code -- lib/src/generated android/src/main/kotlin/com/revolutpay/flutter/generated/RevolutApi.g.kt ios/revolut_sdk_bridge/Sources/revolut_sdk_bridge/Generated/RevolutApi.g.swift
      - name: Verify generated models
        run: |
          bash tool/generate_models.sh
          git diff --exit-code -- lib/src/models
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: example

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: example
      - run: ./gradlew :revolut_sdk_bridge:testReleaseUnitTest
        working-directory: example/android

  ios-build:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: revolut_sdk_bridge
    strategy:
      fail-fast: false
      matrix:
        swiftpm: [true, false]
    steps:
      - uses: actions/checkout@v4
        with:
          path: revolut_sdk_bridge
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Select iOS dependency manager
        env:
          SWIFTPM: ${{ matrix.swiftpm }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          path = Path('example/pubspec.yaml')
          path.write_text(path.read_text().replace(
              'enable-swift-package-manager: true',
              'enable-swift-package-manager: ' + os.environ['SWIFTPM']))
          PYTHON
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: revolut_sdk_bridge/example
