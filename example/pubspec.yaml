name: revolut_sdk_bridge_example
description: "Demonstrates how to use the revolut_sdk_bridge plugin."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  revolut_sdk_bridge:
    path: ../

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true
